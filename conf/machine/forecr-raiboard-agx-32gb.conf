#@TYPE: Machine
#@NAME: Forecr RAIBOARD-AGX (AGX Orin 32GB)
#@DESCRIPTION: Forecr RAIBOARD-AGX carrier board for the Jetson AGX Orin 32GB module.

TEGRA_BOARDSKU ?= "0004"
FORECR_ORIN_MODULE = "p3701-0004"

# 32GB AGX Orin (P3701-0004) has 8 CPU cores; tegra234.inc's default
# nvpmodel_p3701_0000 (64GB, 12 cores) fails at boot trying to toggle
# cpu8..cpu11, leaving nvpmodel.service failed and no power mode applied.
NVPMODEL = "nvpmodel_p3701_0004"

require conf/machine/include/forecr-raiboard-agx.inc
