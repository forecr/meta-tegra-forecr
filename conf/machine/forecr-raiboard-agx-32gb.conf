#@TYPE: Machine
#@NAME: Forecr RAIBOARD-AGX
#@DESCRIPTION: Forecr RAIBOARD-AGX carrier board for the Jetson AGX Orin 32GB module.

MACHINEOVERRIDES =. "forecr:forecr-raiboard-agx:"

TEGRA_BOARDSKU ?= "0004"

# The -base DTB here avoids a kernel panic, as this lets userspace set
# up a USB gadget device for flashing purposes.
KERNEL_DEVICETREE ?= "tegra234-p3737-0000+p3701-0004-nv-raiboard-agx-base.dtb"
TEGRA_BUPGEN_SPECS ?= "fab=300;boardsku=0004;boardrev=;chipsku=00:00:00:D0;bup_type=bl \
                       fab=300;boardsku=0004;boardrev=;bup_type=kernel"

TEGRA_FLASHVAR_PMIC_CONFIG ?= "tegra234-mb1-bct-pmic-p3701-0005.dts"

# Board-specific pinmux/padvoltage.
TEGRA_FLASHVAR_PINMUX_CONFIG = "tegra234-forecr-raiboard-agx-pinmux.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG = "tegra234-forecr-raiboard-agx-padvoltage-default.dtsi"

# 32GB AGX Orin (P3701-0004) has 8 CPU cores; tegra234.inc's default
# nvpmodel_p3701_0000 (64GB, 12 cores) fails at boot trying to toggle
# cpu8..cpu11, leaving nvpmodel.service failed and no power mode applied.
NVPMODEL = "nvpmodel_p3701_0004"

require conf/machine/include/agx-orin.inc
require conf/machine/include/p3737.inc

TEGRA_PLUGIN_MANAGER_OVERLAYS = "tegra234-p3737-0000+p3701-0000-dynamic.dtbo tegra234-carveouts.dtbo tegra-optee.dtbo"

require conf/machine/include/forecr-recommends.inc

