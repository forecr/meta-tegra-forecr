#@TYPE: Machine
#@NAME: Forecr DSBOARD-THRMAX (T5000 module)
#@DESCRIPTION: Forecr DSBOARD-THRMAX carrier board for the Jetson AGX Thor
# T5000 (P3834-0008) module.

MACHINEOVERRIDES =. "forecr:"

require conf/machine/include/agx-thor-t5000.inc
require conf/machine/include/p4071.inc

# Board-specific pinmux/padvoltage.
TEGRA_FLASHVAR_PINMUX_CONFIG = "tegra264-mb1-bct-pinmux-forecr-dsboard-thrmax.dts"
TEGRA_FLASHVAR_PMC_CONFIG = "tegra264-mb1-bct-padvoltage-forecr-dsboard-thrmax.dts"

# DeepStream SDK. deepstream-9.1/-pyds and their meta-tegra-community-only
# DEPENDS (yaml-cpp-080, opentelemetry-cpp-1230, python3-cuda,
# python3-pyclibrary) are vendored directly into this layer's
# recipes-devtools/ and recipes-support/ -- see the provenance comment atop
# each of those recipes. Still requires meta-openembedded's
# meta-oe/meta-python/meta-networking in BBLAYERS for the rest of the chain
# (grpc/protobuf/jsoncpp/mosquitto/python bindings), which build_bitbake.sh
# clones and adds automatically. deepstream-9.1-pyds adds the Python
# application bindings on top of the core SDK.
MACHINE_EXTRA_RRECOMMENDS += "\
    cudnn \
    cuda-toolkit \
    tensorrt-core \
    deepstream-9.1 \
    deepstream-9.1-pyds \
"
