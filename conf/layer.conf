# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tegra-forecr"
BBFILE_PATTERN_meta-tegra-forecr = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tegra-forecr = "6"

LAYERDEPENDS_meta-tegra-forecr = "core"
LAYERSERIES_COMPAT_meta-tegra-forecr = "scarthgap"
