#
# This file is your local configuration file and is where all local user settings
# are placed. The comments in this file give some guide to the options a new user
# to the system might want to change but pretty much any configuration option can
# be set in this file. More adventurous users can look at
# local.conf.sample.extended which contains other examples of configuration which
# can be placed in this file but new users likely won't need any of them
# initially. There's also site.conf.sample which contains examples of site specific
# information such as proxy server addresses.
#
# Lines starting with the '#' character are commented out and in some cases the
# default values are provided as comments to show people example syntax. Enabling
# the option is a question of removing the # character and making any change to the
# variable as required.

#
# Where to place downloads
#
# During a first build the system will download many different source code tarballs
# from various upstream projects. This can take a while, particularly if your network
# connection is slow. These are all stored in DL_DIR. When wiping and rebuilding you
# can preserve this directory to speed up this part of subsequent builds. This directory
# is safe to share between multiple builds on the same machine too.
#
#DL_DIR ?= "${TOPDIR}/downloads"

#
# Where to place shared-state files
#
# BitBake has the capability to accelerate builds based on previously built output.
# This is done using "shared state" files which can be thought of as cache objects
# and this option determines where those files are placed.
#
#SSTATE_DIR ?= "${TOPDIR}/sstate-cache"

#
# Where to place the build output
#
#TMPDIR = "${TOPDIR}/tmp"

#
# Additional image features
#
#   - 'buildstats' collect build statistics
USER_CLASSES ?= "buildstats"

# By default disable interactive patch resolution (tasks will just fail instead):
PATCHRESOLVE = "noop"

#
# Disk Space Monitoring during the build
#
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

CONF_VERSION = "2"

########################################################################
# Forecr / meta-tegra-forecr configuration
########################################################################
# This file is copied verbatim to build-<MACHINE>/conf/local.conf by
# ../../../build_bitbake.sh -- edit it here, not in a build directory, so
# the fix survives a fresh clone / another person's checkout. See
# meta-tegra-forecr/README.md.

MACHINE = "forecr-dsboard-agx"

# DISTRO defaults to "nodistro" (bare openembedded-core, no meta-poky
# distro-policy layer in this workspace), whose baseline DISTRO_FEATURES is
# deliberately minimal. Known gap hit so far: weston-xwayland (pulled in by
# core-image-weston) needs pam, which nodistro doesn't enable by default.
# Add more here as later builds demand them (bluetooth, wifi, polkit, etc.
# are other common ones DISTRO_FEATURES gates on).
DISTRO_FEATURES:append = " pam"

# Use dpkg/apt (.deb) instead of bare OE-core's default (opkg/.ipk) as the
# package format and target-side package manager.
PACKAGE_CLASSES = "package_deb"

# Install dpkg/apt (matching PACKAGE_CLASSES above) into the image itself so
# packages can be installed/removed on-device at runtime, not just used as
# the build's internal packaging format.
EXTRA_IMAGE_FEATURES:append = " package-management"

# EXPERIMENT: meta-tegra's default (USE_PREBUILT_OPTEE=0) source-builds
# OP-TEE 4.6 from scratch. On real DSBOARD-THRMAX hardware this hangs
# forever right after Hafnium loads it as a secure partition -- repeated
# "Stage-2 page fault" / "Injecting Data Abort exception into VM 0x8001"
# on the serial console, an infinite loop that never hands control back to
# UEFI/the kernel (which is why USB/ADB never comes up during flashing: the
# boot never gets that far). Unrelated to pinmux/BCT/EEPROM, all confirmed
# correct by this point -- OP-TEE doesn't consume carrier-board config.
# Trying NVIDIA's prebuilt secure-os binary instead of meta-tegra's
# from-source build to see if this is a wrynose/T264 OP-TEE build bug.
# Not yet confirmed on AGX Orin -- applying preemptively since the bug is
# in shared, non-board-specific secure-os code.
USE_PREBUILT_OPTEE = "1"

# Dev login: passwordless root. This version of oe-core split the old
# "debug-tweaks" combo feature into discrete IMAGE_FEATURES (see
# core-image.bbclass) -- allow-empty-password + empty-root-password clears
# root's password, allow-root-login permits root on the console/serial
# getty. Simpler than a dedicated user + sudo/wheel wiring for board
# bring-up; revisit before anything resembling a production image.
EXTRA_IMAGE_FEATURES:append = " allow-empty-password allow-root-login empty-root-password"
